<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Image Grabber</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            width: 420px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stats {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .toolbar {
            background-color: var(--surface);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--accent);
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background-color: var(--border);
        }

        .settings-panel {
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-row input[type="number"], .setting-row input[type="text"] {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            width: 80px;
            font-size: 0.75rem;
        }

        .setting-row input[type="text"] {
            width: 140px;
        }

        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            max-height: 320px;
        }

        .img-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-card input[type="checkbox"] {
            position: absolute;
            top: 4px;
            left: 4px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .img-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 2px;
        }

        footer {
            background-color: var(--surface);
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
            font-size: 0.875rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">📥 HD Image Grabber</div>
        <div class="stats" id="stats-text">0 images found</div>
    </header>

    <div class="toolbar">
        <button class="btn btn-success" id="btn-download">Download Selected (0)</button>
        <button class="btn btn-outline" id="btn-select-all">All</button>
        <button class="btn btn-outline" id="btn-deselect-all">None</button>
        <button class="btn btn-outline" id="btn-rescan">🔄 Rescan</button>
    </div>

    <div class="settings-panel">
        <div class="setting-row">
            <span>Min Width / Height (px):</span>
            <div style="display: flex; gap: 4px;">
                <input type="number" id="min-width" value="300" min="0" placeholder="Width">
                <input type="number" id="min-height" value="300" min="0" placeholder="Height">
            </div>
        </div>
        <div class="setting-row">
            <span>Download Folder Name:</span>
            <input type="text" id="folder-name" value="HD_Image_Grabber" placeholder="Folder name">
        </div>
    </div>

    <div class="grid-container" id="image-grid">
        <div class="loading">Scanning page for images & HD links...</div>
    </div>

    <footer>
        <div class="stats" id="selected-text">0 selected</div>
        <div class="stats" style="color: var(--primary);">Fatkun Style Grabber</div>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
