<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Image Grabber v4</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            width: 440px;
            max-height: 620px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stats {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .toolbar {
            background-color: var(--surface);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.35rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--accent);
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background-color: var(--border);
        }

        .settings-panel {
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-row input, .setting-row select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
        }

        .setting-row input[type="number"] { width: 60px; }
        .setting-row input[type="text"] { width: 110px; }

        /* Container for images */
        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            max-height: 300px;
        }

        /* View Modes */
        /* 1. Grid Big */
        .mode-grid-big {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .mode-grid-big .img-card {
            aspect-ratio: 1;
            height: 100px;
        }

        /* 2. Grid Small */
        .mode-grid-small {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
        }
        .mode-grid-small .img-card {
            aspect-ratio: 1;
            height: 75px;
        }
        .mode-grid-small .img-badge { font-size: 7px; }

        /* 3. List View */
        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .mode-list .img-card {
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 0.5rem;
            gap: 0.5rem;
        }
        .mode-list .img-card img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 0.2rem;
        }
        .mode-list .img-card .img-info {
            flex: 1;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 4. Text Only (Name & Size) */
        .mode-text-only {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .mode-text-only .img-card {
            display: flex;
            align-items: center;
            height: 36px;
            padding: 0 0.5rem;
            gap: 0.5rem;
            font-size: 0.75rem;
        }
        .mode-text-only .img-card img { display: none; }
        .mode-text-only .img-card .img-info { flex: 1; }

        .img-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .img-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-card input[type="checkbox"] {
            position: absolute;
            top: 4px;
            left: 4px;
            accent-color: var(--primary);
            cursor: pointer;
            z-index: 2;
        }

        .img-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 2px;
        }

        footer {
            background-color: var(--surface);
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        /* ZIP progress bar */
        .zip-progress {
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }
        .zip-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 4px;
            overflow: hidden;
        }
        #zip-bar-fill {
            background: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        .zip-text {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .img-badge.hd {
            background: var(--accent);
            color: #052e16;
            font-weight: 700;
        }

        .badge-hd {
            background: var(--accent);
            color: #052e16;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">📥 HD Image Grabber v4</div>
        <div class="stats" id="stats-text">0 found</div>
    </header>

    <div class="toolbar">
        <button class="btn btn-success" id="btn-download">📦 ZIP (0)</button>
        <button class="btn btn-outline" id="btn-download-files">Save Files</button>
        <button class="btn btn-danger hidden" id="btn-stop">Stop</button>
        <button class="btn btn-outline" id="btn-copy">📋 Copy</button>
        <button class="btn btn-outline" id="btn-select-all">All</button>
        <button class="btn btn-outline" id="btn-deselect-all">None</button>
        <button class="btn btn-outline" id="btn-rescan">🔄</button>
    </div>

    <div class="zip-progress hidden" id="zip-progress">
        <div class="zip-bar"><div id="zip-bar-fill"></div></div>
        <div class="zip-text" id="zip-text">Preparing...</div>
    </div>

    <div class="settings-panel">
        <div class="setting-row">
            <span>Min Width / Height:</span>
            <div style="display: flex; gap: 4px;">
                <input type="number" id="min-width" value="200" min="0">
                <input type="number" id="min-height" value="200" min="0">
            </div>
        </div>
        <div class="setting-row">
            <span>Min File Size (KB):</span>
            <input type="number" id="min-kb" value="0" min="0">
        </div>
        <div class="setting-row">
            <span>URL Contains:</span>
            <input type="text" id="url-filter" placeholder="e.g. photo or /large/">
        </div>
        <div class="setting-row">
            <span>Format & View:</span>
            <div style="display: flex; gap: 4px;">
                <select id="format-filter">
                    <option value="all">All Formats</option>
                    <option value="jpeg">JPG</option>
                    <option value="png">PNG</option>
                    <option value="webp">WebP</option>
                    <option value="gif">GIF</option>
                    <option value="avif">AVIF</option>
                </select>
                <select id="view-mode">
                    <option value="grid-big">Grid (Big)</option>
                    <option value="grid-small">Grid (Small)</option>
                    <option value="list">List</option>
                    <option value="text-only">Text Only</option>
                </select>
            </div>
        </div>
        <div class="setting-row">
            <span>Folder Name:</span>
            <input type="text" id="folder-name" value="HD_Image_Grabber">
        </div>
    </div>

    <div class="grid-container mode-grid-big" id="image-grid">
        <div class="loading">Scanning page for images & HD links...</div>
    </div>

    <footer>
        <div class="stats" id="selected-text">Selected: 0</div>
        <div class="stats" style="color: var(--primary);">v4 HD+ZIP</div>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
